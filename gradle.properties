org.gradle.jvmargs=-Xmx2G

# Fabric Properties (https://fabricmc.net/develop)
# Targeting MC 1.21.1 — note: Fabric Loader 0.19.3 targets MC 1.21.5+, so we
# pin Loader 0.16.9 here (last 0.16.x, the one that supports 1.21.1/1.21.2).
minecraft_version=1.21.1
yarn_mappings=1.21+build.9
loader_version=0.16.9
fabric_version=0.116.0+1.21.1

# Mod Properties
mod_version=0.1.0
maven_group=com.hunterbuddy
archives_base_name=hunterbuddy

# Dependencies
# Baritone (Meteor fork) — build.gradle appends "-SNAPSHOT" — do NOT include here.
baritone_version=1.21.1

# Meteor (https://maven.meteordev.org)
# 0.5.8-SNAPSHOT works against 1.21.1 (see vendored meteor-stashhunting-addon-1.21.1).
meteor_version=0.5.8-SNAPSHOT
