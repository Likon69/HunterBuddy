plugins {
    id "fabric-loom" version "1.17-SNAPSHOT"
}

base {
    version = project.mod_version
    group = project.maven_group
}

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Baritone (https://github.com/MeteorDevelopment/baritone)
    modCompileOnly "meteordevelopment:baritone:${project.baritone_version}-SNAPSHOT"

    // Meteor
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"

    // Caffeine + Gson (runtime-only) are used by mlep's ported modules.
    modImplementation "com.github.ben-manes.caffeine:caffeine:3.1.8"
    modImplementation "com.google.code.gson:gson:2.10.1"
    // XaeroPlus 100% port — direct imports of xaero.* / xaeroplus.* classes
    // used by mlep's MapUtil / WaypointFollower / TrailFollower. Bundled
    // locally because XaeroPlus isn't published to a Maven repo.
    modImplementation files("libs/XaeroPlus-2.33.1+fabric-1.21.1-WM1.41.2-MM26.1.0.jar")
    modImplementation files("libs/xaeros-minimap-fabric-1.21.1-26.1.0.jar")
    modImplementation files("libs/xaeros-worldmap-fabric-1.21.1-1.41.2.jar")
}

loom {
    accessWidenerPath = file("src/main/resources/hunterbuddy.accessWidener")
}

tasks {
    processResources {
        def propertyMap = [
            "version"   : project.version,
            "mc_version": project.minecraft_version,
        ]

        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
        from("LICENSE") {
            rename { "${it}_hunterbuddy" }
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }
}
