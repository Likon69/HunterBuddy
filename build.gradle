plugins {
    id "fabric-loom" version "1.17-SNAPSHOT"
}

base {
    archivesName = project.archives_base_name
    version = project.mod_version
    group = project.maven_group
}

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Baritone (https://github.com/MeteorDevelopment/baritone)
    modCompileOnly "meteordevelopment:baritone:${project.baritone_version}-SNAPSHOT"

    // Meteor
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"

    // Caffeine + Gson (runtime-only) are used by mlep's ported modules.
    modImplementation "com.github.ben-manes.caffeine:caffeine:3.1.8"
    modImplementation files("libs/LambdaEvents-2.4.2.jar")
    include files("libs/LambdaEvents-2.4.2.jar")
    modImplementation "com.google.code.gson:gson:2.10.1"
    // Xaero mods — bundled locally (same versions as mlep references).
    modImplementation files("libs/XaeroPlus-2.32.0+fabric-1.21.11.jar")
    modImplementation files("libs/xaeros-minimap-fabric-1.21.11-26.1.0.jar")
    modImplementation files("libs/xaeros-worldmap-fabric-1.21.11-1.41.0.jar")
}

loom {
    accessWidenerPath = file("src/main/resources/hunterbuddy.accessWidener")
}

tasks {
    processResources {
        def propertyMap = [
            "version"   : project.version,
            "mc_version": project.minecraft_version,
        ]

        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
        from("LICENSE") {
            rename { "${it}_hunterbuddy" }
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }
}